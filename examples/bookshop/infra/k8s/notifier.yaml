apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels:
    app: notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
    spec:
      containers:
        - name: notifier
          image: europe-docker.pkg.dev/inkwell/apps/notifier:0.8.1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
