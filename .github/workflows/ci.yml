name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Python tests (extractors, rules golden test, determinism)
        run: python -m unittest discover -s tests -t . -v
      - name: Build the demo graph
        run: python -m sysgraph build examples/bookshop

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Question golden tests and MCP smoke test
        run: npm test
      - name: Explorer smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
